services:
  # 1. FastAPI ML Inference Service
  - type: web
    name: ml-drift-lens-inference
    runtime: docker
    dockerfilePath: ml/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /ready
    envVars:
      - key: PORT
        value: 8000
      - key: INFERENCE_HOST
        value: 0.0.0.0
      - key: INFERENCE_PORT
        value: 8000
      - key: MODEL_ARTIFACT_PATH
        value: ml/artifacts/model.joblib
      - key: LOG_LEVEL
        value: INFO

  # 2. Node.js Express Backend Service
  - type: web
    name: ml-drift-lens-backend
    runtime: docker
    dockerfilePath: ml-drift-lens-backend/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    preDeployCommand: npm run migrate
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: ml-drift-lens-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: ML_SERVICE_URL
        value: http://ml-drift-lens-inference:8000
      - key: CORS_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RENDER_TARGET_ENVIRONMENT
        value: staging
      - key: RENDER_STAGING_SERVICE_ID
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: OPERATOR_AUTHORIZATION_POLICY
        value: unconfigured

  # 3. React Frontend Static Site
  - type: static
    name: ml-drift-lens-frontend
    rootDir: ml-drift-lens-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  # Render Managed PostgreSQL Database
  - name: ml-drift-lens-db
    databaseName: ml_drift_lens
    user: postgres
    plan: free
